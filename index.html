<style>
/* =============================================================
   DESIGN TOKENS
   Identity: an HMI / control-panel look. A dark "control room"
   hero panel over a clean, recruiter-friendly light body.
   Signature: instrument tags, terminal-block chips, a schematic
   grid, and a single traced signal line.
   ============================================================= */
:root{
  --bg:#F6F7F9;          /* page background (drafting paper) */
  --surface:#FFFFFF;     /* cards */
  --panel:#0E1620;       /* dark control-panel hero */
  --panel-2:#131F2B;     /* dark panel gradient stop */
  --ink:#10161C;         /* primary text */
  --muted:#5A6672;       /* secondary text */
  --line:#E4E8ED;        /* hairlines / borders */
  --line-dark:#24303C;   /* hairlines on dark panel */
  --accent:#137A7F;      /* signal teal — primary accent */
  --accent-ink:#0C5155;  /* darker teal for text on light */
  --accent-soft:#E4F1F1; /* teal wash */
  --led:#2FBF71;         /* status LED "online" green */
  --amber:#E0A44B;       /* secondary signal, used sparingly */
  --radius:14px;
  --radius-sm:9px;
  --maxw:1080px;
  --shadow:0 1px 2px rgba(16,22,28,.04), 0 8px 24px rgba(16,22,28,.06);
  --shadow-lg:0 24px 60px rgba(16,22,28,.16);
  --font-display:"Space Grotesk", system-ui, sans-serif;
  --font-body:"IBM Plex Sans", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, monospace;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--bg);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
a{color:inherit;}
img{max-width:100%;display:block;}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.12;margin:0;letter-spacing:-.01em;}

/* ---- utility: instrument tag (monospace label) ---- */
.tag{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--accent-ink);
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.tag::before{
  content:"";
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}

/* =============================================================
   NAV
   ============================================================= */
.nav{
  position:sticky;top:0;z-index:50;
  background:rgba(246,247,249,.82);
  backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid var(--line);
}
.nav-inner{
  max-width:var(--maxw);margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.brand{
  font-family:var(--font-mono);font-weight:600;font-size:14px;letter-spacing:.02em;
  display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);
}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--led);box-shadow:0 0 8px var(--led);}
.nav-links{display:flex;align-items:center;gap:4px;}
.nav-links a{
  font-size:13.5px;font-weight:500;color:var(--muted);text-decoration:none;
  padding:8px 12px;border-radius:8px;transition:color .15s, background .15s;
}
.nav-links a:hover{color:var(--ink);background:#EDF0F3;}
.nav-cta{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;
  padding:9px 14px;border-radius:8px;text-decoration:none;
  background:var(--ink);color:#fff;border:1px solid var(--ink);
  transition:transform .15s, opacity .15s;
}
.nav-cta:hover{opacity:.9;transform:translateY(-1px);}
.nav-toggle{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;}

/* =============================================================
   HERO — dark control-panel
   ============================================================= */
.hero{
  position:relative;overflow:hidden;
  background:
    radial-gradient(120% 120% at 85% -10%, rgba(19,122,127,.25), transparent 55%),
    linear-gradient(160deg, var(--panel) 0%, var(--panel-2) 100%);
  color:#E7EDF2;
  border-bottom:1px solid var(--line);
}
/* faint schematic grid */
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(140,170,190,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(140,170,190,.06) 1px, transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(120% 90% at 30% 20%, #000 40%, transparent 90%);
}
.hero-inner{
  position:relative;z-index:2;
  max-width:var(--maxw);margin:0 auto;padding:76px 24px 88px;
}
.status{
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:#9FB2BF;border:1px solid var(--line-dark);border-radius:999px;
  padding:7px 14px;margin-bottom:26px;background:rgba(255,255,255,.02);
}
.status .led{width:8px;height:8px;border-radius:50%;background:var(--led);box-shadow:0 0 10px var(--led);}
@media (prefers-reduced-motion:no-preference){
  .status .led{animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 10px var(--led);}50%{opacity:.45;box-shadow:0 0 3px var(--led);}}
}
.hero h1{
  font-size:clamp(38px,7vw,68px);font-weight:700;letter-spacing:-.02em;
  color:#F4F8FA;margin:0 0 10px;
}
.hero .role{
  font-family:var(--font-mono);font-size:clamp(14px,2.4vw,18px);
  color:var(--accent);letter-spacing:.02em;margin-bottom:22px;font-weight:500;
}
.hero .role .sep{color:var(--line-dark);margin:0 10px;}
.hero .lede{
  max-width:620px;font-size:clamp(15px,2.2vw,17.5px);color:#BCC9D2;margin-bottom:30px;
}
/* signal line */
.signal{position:relative;height:2px;max-width:620px;margin:0 0 34px;background:var(--line-dark);border-radius:2px;overflow:hidden;}
.signal::after{
  content:"";position:absolute;top:0;left:0;height:100%;width:38%;
  background:linear-gradient(90deg, transparent, var(--accent), transparent);
}
@media (prefers-reduced-motion:no-preference){
  .signal::after{animation:trace 3.6s linear infinite;}
  @keyframes trace{0%{left:-40%;}100%{left:100%;}}
}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:34px;}
.btn{
  display:inline-flex;align-items:center;gap:9px;text-decoration:none;cursor:pointer;
  font-family:var(--font-mono);font-size:13px;letter-spacing:.03em;
  padding:12px 18px;border-radius:10px;transition:transform .15s, background .15s, border-color .15s;
  border:1px solid transparent;
}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#0F676B;transform:translateY(-1px);}
.btn-ghost{background:rgba(255,255,255,.04);color:#DCE6EC;border-color:var(--line-dark);}
.btn-ghost:hover{background:rgba(255,255,255,.09);transform:translateY(-1px);}
.contact-strip{display:flex;flex-wrap:wrap;gap:10px 22px;font-family:var(--font-mono);font-size:12.5px;color:#93A4AF;}
.contact-strip a{color:#B7C6CF;text-decoration:none;transition:color .15s;}
.contact-strip a:hover{color:var(--accent);}
.contact-strip span{display:inline-flex;align-items:center;gap:7px;}

/* =============================================================
   SECTIONS (light body)
   ============================================================= */
.section{max-width:var(--maxw);margin:0 auto;padding:72px 24px;}
.section-head{margin-bottom:36px;}
.section-head .eyebrow{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent-ink);display:block;margin-bottom:12px;
}
.section-head h2{font-size:clamp(26px,4vw,36px);}
.section-head p{color:var(--muted);margin:12px 0 0;max-width:640px;}

/* ---- Projects ---- */
.projects{display:grid;gap:24px;}
.project{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.project-head{padding:24px 26px 0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;}
.project-head .idtag{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);}
.project-head .date{font-family:var(--font-mono);font-size:12px;color:var(--muted);}
.project-body{padding:10px 26px 24px;}
.project-body h3{font-size:22px;margin-bottom:12px;}
.project-body .desc{color:#3C4750;margin:0;}
.project-body .desc li{margin-bottom:7px;}
.project-body ul{margin:0;padding-left:20px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0 0;}
.chip{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.02em;color:#33424C;
  background:#F1F4F6;border:1px solid var(--line);border-radius:6px;padding:5px 10px;
}
/* media gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:20px;}
.thumb{
  position:relative;aspect-ratio:16/10;border-radius:var(--radius-sm);overflow:hidden;
  border:1px solid var(--line);cursor:pointer;background:#EDEFF2;
  transition:transform .18s, box-shadow .18s, border-color .18s;
}
.thumb:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent);}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb .play{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(14,22,32,.28);
}
.thumb .play svg{width:40px;height:40px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
.thumb .broken{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--font-mono);font-size:11px;color:var(--muted);padding:10px;
}

/* ---- Experience ---- */
.exp{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:28px;
}
.exp-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline;}
.exp-top h3{font-size:22px;}
.exp-top .company{color:var(--accent-ink);font-family:var(--font-mono);font-size:13px;margin-top:4px;}
.exp-top .date{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);}
.exp ul{margin:18px 0 0;padding-left:20px;color:#3C4750;}
.exp li{margin-bottom:8px;}

/* ---- Education / two-col cards ---- */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:24px;
}
.card h3{font-size:18px;margin-bottom:4px;}
.card .sub{font-family:var(--font-mono);font-size:12.5px;color:var(--accent-ink);margin-bottom:12px;}
.card .meta{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:12px;}
.card .gpa{font-family:var(--font-mono);color:var(--ink);font-weight:500;}
.coursework{font-size:14px;color:#3C4750;margin-top:14px;}

/* ---- Skills ---- */
.skillgroup{margin-bottom:26px;}
.skillgroup h4{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:14px;}
.skillgroup .chips{margin-top:0;}
.skillgroup .chip{background:var(--surface);padding:8px 13px;font-size:12.5px;}

/* ---- Footer / contact ---- */
.footer{background:var(--panel);color:#C6D2DA;border-top:1px solid var(--line);}
.footer-inner{max-width:var(--maxw);margin:0 auto;padding:56px 24px;}
.footer h2{color:#F4F8FA;font-size:clamp(24px,4vw,34px);margin-bottom:14px;}
.footer p{color:#9FB2BF;max-width:520px;margin:0 0 26px;}
.footer-links{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:40px;}
.footer-meta{border-top:1px solid var(--line-dark);padding-top:22px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-family:var(--font-mono);font-size:11.5px;color:#7C8D97;}

/* =============================================================
   LIGHTBOX
   ============================================================= */
.lightbox{
  position:fixed;inset:0;z-index:100;display:none;
  align-items:center;justify-content:center;padding:24px;
  background:rgba(8,13,18,.9);backdrop-filter:blur(4px);
}
.lightbox.open{display:flex;}
.lightbox-content{position:relative;max-width:1000px;width:100%;max-height:88vh;}
.lightbox-content img{width:100%;max-height:88vh;object-fit:contain;border-radius:10px;}
.lightbox-content .frame{position:relative;width:100%;aspect-ratio:16/9;}
.lightbox-content iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px;background:#000;}
.lb-close,.lb-nav{
  position:absolute;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#fff;cursor:pointer;border-radius:10px;display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.lb-close{top:-52px;right:0;width:40px;height:40px;font-size:20px;}
.lb-close:hover,.lb-nav:hover{background:rgba(255,255,255,.22);}
.lb-nav{top:50%;transform:translateY(-50%);width:44px;height:64px;font-size:22px;}
.lb-prev{left:-58px;}
.lb-next{right:-58px;}
.lb-caption{margin-top:14px;text-align:center;font-family:var(--font-mono);font-size:12.5px;color:#B7C6CF;}

/* =============================================================
   RESPONSIVE
   ============================================================= */
@media (max-width:820px){
  .grid-2{grid-template-columns:1fr;}
  .nav-links{display:none;}
  .nav-toggle{display:inline-flex;}
  .nav-links.show{
    display:flex;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;
    background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px 16px;gap:2px;
  }
  .nav-links.show a{padding:12px;}
  /* --- mobile lightbox: give the video the full width and move the
     prev/next arrows into a row BELOW it so they don't cover it --- */
  .lightbox{padding:10px;}
  .lightbox-content{max-width:100%;text-align:center;}
  .lightbox-content img{max-height:70vh;}
  .lb-close{top:-46px;right:2px;}
  .lb-nav{position:static;transform:none;display:inline-flex;width:76px;height:46px;margin:16px 8px 0;font-size:24px;}
}
@media (max-width:520px){
  .section{padding:56px 18px;}
  .hero-inner{padding:56px 18px 64px;}
  .nav-inner{padding:12px 18px;}
}
</style>
</head>

      tech: ["IR Detection", "Servo Actuation", "Embedded Control", "Prototyping"],
      media: [
        { type: "video", src: "https://youtu.be/UkaSsYUyiew" },
        { type: "image", src: "https://drive.google.com/file/d/1-WydC-dfKIANCwxqL97Pxq4IZ_9ybZPm/view?usp=sharing" },
        { type: "image", src: "https://drive.google.com/file/d/1kmLHveLHvbg7e9zA1M5BYZ-t_dlWx7U1/view?usp=sharing" }
      ]
    }
  ]
};

/* ============================================================= */
/*   RENDERING ENGINE — you normally don't need to touch below.  */
/* ============================================================= */
(function(){
  const $ = (s,el=document)=>el.querySelector(s);
  const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* --- Google Drive / YouTube link helpers --- */
  function driveId(url){
    if(!url) return null;
    let m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/); if(m) return m[1];
    m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);          if(m) return m[1];
    m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);            if(m) return m[1];
    return null;
  }
  function ytId(url){
    if(!url) return null;
    let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{6,})/);
    return m ? m[1] : null;
  }
  function imageSrc(src){
    const id = driveId(src);
    if(id) return `https://drive.google.com/thumbnail?id=${id}&sz=w1600`;
    return src;
  }
  function videoEmbed(src){
    const yt = ytId(src);
    if(yt) return `https://www.youtube.com/embed/${yt}`;
    const id = driveId(src);
    if(id) return `https://drive.google.com/file/d/${id}/preview`;
    return src;
  }

  const C = CONFIG;

  /* --- basic info --- */
  $('#brand-name').textContent = C.name.toUpperCase();
  $('#hero-name').textContent = C.name;
  document.title = `${C.name} — ${C.role.join(' · ')}`;
  $('#hero-role').innerHTML = C.role.map(esc).join('<span class="sep">·</span>');
  $('#nav-linkedin').href = C.linkedin || '#';

  /* --- contact strip --- */
  const contact = [];
  if(C.email) contact.push(`<span>✉ <a href="mailto:${esc(C.email)}">${esc(C.email)}</a></span>`);
  if(C.phone) contact.push(`<span>☎ <a href="tel:${esc(C.phone.replace(/[^\d+]/g,''))}">${esc(C.phone)}</a></span>`);
  if(C.location) contact.push(`<span>⌖ ${esc(C.location)}</span>`);
  if(C.linkedin) contact.push(`<span>in <a href="${esc(C.linkedin)}" target="_blank" rel="noopener">LinkedIn</a></span>`);
  $('#hero-contact').innerHTML = contact.join('');

  /* --- projects --- */
  const playSVG = `<svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="11" fill="rgba(19,122,127,.92)"/><path d="M10 8l6 4-6 4z" fill="#fff"/></svg>`;
  const projHTML = (C.projects||[]).map((p, pi)=>{
    const bullets = (p.bullets||[]).map(b=>`<li>${esc(b)}</li>`).join('');
    const chips = (p.tech||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('');
    const media = (p.media||[]).filter(m=>m && m.src && !/PASTE_/.test(m.src));
    const gallery = media.map((m,mi)=>{
      if(m.type==='video'){
        return `<div class="thumb" data-p="${pi}" data-m="${mi}">
          <div class="broken">▶ Video</div>
          <div class="play">${playSVG}</div>
        </div>`;
      }
      return `<div class="thumb" data-p="${pi}" data-m="${mi}">
        <img src="${esc(imageSrc(m.src))}" alt="${esc(p.title)} photo" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <div class="broken" style="display:none">Image unavailable — check Drive sharing is set to “Anyone with the link”</div>
      </div>`;
    }).join('');
    const galleryBlock = media.length ? `<div class="gallery">${gallery}</div>` : '';
    return `<article class="project">
      <div class="project-head">
        <span class="idtag">${esc(p.tag||'')}</span>
        <span class="date">${esc(p.date||'')}</span>
      </div>
      <div class="project-body">
        <h3>${esc(p.title)}</h3>
        <ul class="desc">${bullets}</ul>
        <div class="chips">${chips}</div>
        ${galleryBlock}
      </div>
    </article>`;
  }).join('');
  $('#projects-list').innerHTML = projHTML;

  /* --- footer --- */
  const fl = [];
  if(C.email) fl.push(`<a class="btn btn-primary" href="mailto:${esc(C.email)}">✉ ${esc(C.email)}</a>`);
  if(C.linkedin) fl.push(`<a class="btn btn-ghost" href="${esc(C.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>`);
  $('#footer-links').innerHTML = fl.join('');
  $('#footer-copy').textContent = `© ${new Date().getFullYear()} ${C.name}`;

  /* --- lightbox --- */
  const lb = $('#lightbox'), lbc = $('#lightbox-content');
  let flat = [];
  (C.projects||[]).forEach((p,pi)=>(p.media||[]).forEach((m,mi)=>{
    if(m && m.src && !/PASTE_/.test(m.src)) flat.push({p:pi,m:mi,item:m,title:p.title});
  }));
  let current = -1;
  function keyOf(pi,mi){ return flat.findIndex(f=>f.p==pi && f.m==mi); }
  function renderLB(){
    const f = flat[current]; if(!f) return;
    const m = f.item;
    let inner;
    if(m.type==='video'){
      inner = `<div class="frame"><iframe src="${esc(videoEmbed(m.src))}" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>`;
    }else{
      inner = `<img src="${esc(imageSrc(m.src))}" alt="${esc(f.title)}">`;
    }
    const nav = flat.length>1 ? `<button class="lb-nav lb-prev" aria-label="Previous">‹</button><button class="lb-nav lb-next" aria-label="Next">›</button>` : '';
    lbc.innerHTML = `<button class="lb-close" aria-label="Close">✕</button>${inner}${nav}<div class="lb-caption">${esc(f.title)} — ${current+1} / ${flat.length}</div>`;
    lbc.querySelector('.lb-close').onclick = close;
    const pv = lbc.querySelector('.lb-prev'), nx = lbc.querySelector('.lb-next');
    if(pv) pv.onclick = ()=>{ current=(current-1+flat.length)%flat.length; renderLB(); };
    if(nx) nx.onclick = ()=>{ current=(current+1)%flat.length; renderLB(); };
  }
  function open(pi,mi){ current = keyOf(pi,mi); if(current<0) return; lb.classList.add('open'); document.body.style.overflow='hidden'; renderLB(); }
  function close(){ lb.classList.remove('open'); lbc.innerHTML=''; document.body.style.overflow=''; }
  document.addEventListener('click', e=>{
    const t = e.target.closest('.thumb');
    if(t){ open(+t.dataset.p, +t.dataset.m); }
  });
  lb.addEventListener('click', e=>{ if(e.target===lb) close(); });
  document.addEventListener('keydown', e=>{
    if(!lb.classList.contains('open')) return;
    if(e.key==='Escape') close();
    if(flat.length>1 && e.key==='ArrowLeft'){ current=(current-1+flat.length)%flat.length; renderLB(); }
    if(flat.length>1 && e.key==='ArrowRight'){ current=(current+1)%flat.length; renderLB(); }
  });

  /* --- mobile nav --- */
  const toggle = $('#navtoggle'), links = $('#navlinks');
  toggle.addEventListener('click', ()=> links.classList.toggle('show'));
  links.addEventListener('click', e=>{ if(e.target.tagName==='A') links.classList.remove('show'); });
})();
</script>
</body>
</html>
